[package]
name = "tuyufactory-native"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
getrandom = "=0.3.4"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
thiserror = "=2.0.20"
tokio = { version = "=1.53.1", features = ["net", "rt", "time"] }
tokio-postgres = { version = "0.7", features = ["with-uuid-1"] }
tuyu-account = { git = "https://github.com/tuyutata/tuyuserve.git", rev = "435e585bd59aabe5bec3d4ca21074abbae864b43" }
uuid = { version = "1", features = ["serde", "v7"] }

[dev-dependencies]
schnorrkel = { version = "=0.11.5", default-features = false, features = ["alloc", "getrandom", "preaudit_deprecated"] }
tempfile = "=3.27.0"
