name: tuyufactory
description: "TuyuFactory unified manufacturer desktop application."
publish_to: 'none'
# 主机与分机各平台的正式首版从 1.0.0 起步；后续分别按自身正式 Release 递增。
version: 1.0.0+1

environment:
  sdk: '>=3.12.0 <4.0.0'

dependencies:
  citizen_sdk:
    git:
      url: https://github.com/crcfrcn/citizensdk.git
      path: .
      ref: 3e53f18354e1b21c75d7e4543f2102ba8163c575
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  ffi: 2.2.0
  flutter_lite_camera: ^0.1.0
  provider: ^6.1.5+1
  crypto: 3.0.7
  path_provider: ^2.1.6
  zxing2: ^0.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0

flutter:
  # Apple端沿用CitizenSDK公开CocoaPods插件，原生产物由CitizenSDK产品入口准备。
  config:
    enable-swift-package-manager: false
  generate: true
  assets:
    - tuyu_logo.png
  uses-material-design: true
