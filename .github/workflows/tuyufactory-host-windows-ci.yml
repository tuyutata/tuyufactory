# tuyufactory.host-windows.ci 的独立 GitHub 工作流。
name: tuyufactory.host-windows.ci
# 远端标题只展示产品、平台、流程；内部 pipeline 仍承担唯一机器身份。
run-name: "${{ inputs.run_title }}"
'on':
  workflow_dispatch:
    inputs:
      pipeline:
        required: true
        type: string
      run_title:
        required: true
        type: string
      source_sha:
        required: false
        type: string
      ci_run_id:
        required: false
        type: string
      version_tag:
        required: false
        type: string
      software_version:
        required: false
        type: string
      spec_version:
        required: false
        type: string
      chain_spec_version:
        required: false
        type: string
      genesis_hash:
        required: false
        type: string
      finalized_head:
        required: false
        type: string
concurrency:
  group: tuyufactory.host-windows.ci
  cancel-in-progress: false
jobs:
  flow:
    name: 途遇厂家端 · CI · 主机 Windows
    runs-on: windows-2025
    timeout-minutes: 120
    permissions:
      actions: write
      contents: read
    env:
      CI: true
      WRANGLER_SEND_METRICS: false
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: '1'
      CARGO_INCREMENTAL: '0'
      GH_TOKEN: "${{ github.token }}"
      TUYU_SOURCE_SHA: "${{ github.sha }}"
      SOURCE_SHA: "${{ github.sha }}"
    steps:
    - shell: bash
      env:
        PIPELINE: "${{ inputs.pipeline }}"
        RUN_TITLE: "${{ inputs.run_title }}"
        SOURCE_SHA: "${{ inputs.source_sha }}"
        CI_RUN_ID: "${{ inputs.ci_run_id }}"
        VERSION_TAG: "${{ inputs.version_tag }}"
        SOFTWARE_VERSION: "${{ inputs.software_version }}"
        SPEC_VERSION: "${{ inputs.spec_version }}"
        CHAIN_SPEC_VERSION: "${{ inputs.chain_spec_version }}"
        GENESIS_HASH: "${{ inputs.genesis_hash }}"
        FINALIZED_HEAD: "${{ inputs.finalized_head }}"
      run: |-
        node --input-type=module <<'NODE'
        const e=process.env,allowed=new Set(["tuyufactory.host-windows.ci"]);
        if(!allowed.has(e.PIPELINE||''))throw Error('产品流程身份无效');
        if(e.RUN_TITLE!=="途遇厂家端 · 主机 Windows · CI")throw Error('产品平台流程展示标题无效');
        if([e.CI_RUN_ID,e.VERSION_TAG,e.SOFTWARE_VERSION,e.SPEC_VERSION,e.CHAIN_SPEC_VERSION,e.GENESIS_HASH,e.FINALIZED_HEAD].some(Boolean))throw Error('CI输入包含Release字段');
        NODE
    - name: 检出准确产品源码
      uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      with:
        ref: "${{ github.sha }}"
        fetch-depth: 0
        persist-credentials: false
    - name: 装载准确Rust
      uses: dtolnay/rust-toolchain@032958afbdc797a9164d3bc0b56325c1308924a5
      with:
        toolchain: 1.97.1
        targets: x86_64-pc-windows-msvc
        components: rustfmt
    - shell: pwsh
      run: node "$env:GITHUB_WORKSPACE/scripts/host/ci/windows/factory-host-windows/execute.mjs" workflow-step 0
    - env:
        SOURCE_SHA: "${{ github.sha }}"
      shell: pwsh
      run: node "$env:GITHUB_WORKSPACE/scripts/host/ci/windows/factory-host-windows/execute.mjs" workflow-step 1
    - id: ci_factory_host_windows__ci_cache
      env:
        GH_TOKEN: "${{ github.token }}"
        CI_CACHE_PRODUCT: tuyufactory-host
        CI_CACHE_PLATFORM: windows
        CI_CACHE_ARCHITECTURE: x86-64
        CI_CACHE_COMPONENT: ci-factory-host-windows
        CI_CACHE_WORKFLOW: tuyufactory-host-windows
        CI_CACHE_JOB: ci-factory-host-windows
        CI_CACHE_TOOLCHAIN_FINGERPRINT: "${{ hashFiles('**/Cargo.lock', '**/pubspec.lock', '**/package-lock.json', '**/dependencies.lock.json', '**/runtime.lock.json') }}"
        CI_CACHE_PATHS: |
          cargo-home
          cargo-target
          dart-pub
          flutter-build
          npm
          xdg
        CI_CACHE_LINKS: 'app/build=flutter-build

          '
        CI_CACHE_FINALS: |
          cargo-target/release/bundle
          flutter-build/windows/x64/runner/Release
      shell: bash
      run: node "$GITHUB_WORKSPACE/scripts/host/ci/windows/factory-host-windows/execute.mjs" workflow-step 2
    - name: 恢复上一次成功的CI增量缓存
      continue-on-error: true
      uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684
      with:
        path: "${{ steps.ci_factory_host_windows__ci_cache.outputs.success_paths }}"
        key: "${{ steps.ci_factory_host_windows__ci_cache.outputs.restore_key }}"
    - shell: bash
      run: node "$GITHUB_WORKSPACE/scripts/host/ci/windows/factory-host-windows/execute.mjs" workflow-step 3
    - shell: bash
      run: node "$GITHUB_WORKSPACE/scripts/host/ci/windows/factory-host-windows/execute.mjs" workflow-step 4
    - id: flutter_2
      shell: bash
      run: node "$GITHUB_WORKSPACE/scripts/host/ci/windows/factory-host-windows/execute.mjs" workflow-step 5
    - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
      with:
        flutter-version: "${{ steps.flutter_2.outputs.version }}"
        cache: false
    - shell: bash
      run: node "$GITHUB_WORKSPACE/scripts/host/ci/windows/factory-host-windows/execute.mjs" workflow-step 6
    - shell: bash
      run: node "$GITHUB_WORKSPACE/scripts/host/ci/windows/factory-host-windows/execute.mjs" workflow-step 7
    - if: "${{ failure() && !cancelled() }}"
      env:
        CI_CACHE_TERMINAL_STATE: failure
      shell: bash
      run: node "$GITHUB_WORKSPACE/scripts/host/ci/windows/factory-host-windows/execute.mjs" workflow-step 8
    - if: "${{ failure() && !cancelled() }}"
      name: 保存本次失败的CI增量缓存
      id: ci_factory_host_windows__ci_cache_save_failure
      continue-on-error: true
      uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684
      with:
        path: "${{ steps.ci_factory_host_windows__ci_cache.outputs.failure_paths }}"
        key: "${{ steps.ci_factory_host_windows__ci_cache.outputs.failure_key }}"
    - if: "${{ failure() && !cancelled() && steps.ci_factory_host_windows__ci_cache_save_failure.outcome == 'success' }}"
      continue-on-error: true
      env:
        GH_TOKEN: "${{ github.token }}"
        CI_CACHE_TERMINAL_STATE: failure
      shell: bash
      run: node "$GITHUB_WORKSPACE/scripts/host/ci/windows/factory-host-windows/execute.mjs" workflow-step 9
    - if: "${{ success() }}"
      env:
        CI_CACHE_TERMINAL_STATE: success
      shell: bash
      run: node "$GITHUB_WORKSPACE/scripts/host/ci/windows/factory-host-windows/execute.mjs" workflow-step 10
    - if: "${{ success() }}"
      name: 保存本次成功的CI增量缓存
      id: ci_factory_host_windows__ci_cache_save_success
      continue-on-error: true
      uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684
      with:
        path: "${{ steps.ci_factory_host_windows__ci_cache.outputs.success_paths }}"
        key: "${{ steps.ci_factory_host_windows__ci_cache.outputs.success_key }}"
    - if: "${{ success() && steps.ci_factory_host_windows__ci_cache_save_success.outcome == 'success' }}"
      continue-on-error: true
      env:
        GH_TOKEN: "${{ github.token }}"
        CI_CACHE_TERMINAL_STATE: success
      shell: bash
      run: node "$GITHUB_WORKSPACE/scripts/host/ci/windows/factory-host-windows/execute.mjs" workflow-step 11
    - name: 清空本产品固定构建目录
      if: always()
      shell: bash
      run: node "$GITHUB_WORKSPACE/scripts/target.mjs" finish build
