# tuyufactory.client-ios.release 的独立 GitHub 工作流。
name: tuyufactory.client-ios.release
# 远端标题只展示产品、平台、流程；内部 pipeline 仍承担唯一机器身份。
run-name: "${{ inputs.run_title }}"
'on':
  workflow_dispatch:
    inputs:
      pipeline:
        required: true
        type: string
      run_title:
        required: true
        type: string
      source_sha:
        required: false
        type: string
      ci_run_id:
        required: false
        type: string
      version_tag:
        required: false
        type: string
      software_version:
        required: false
        type: string
      spec_version:
        required: false
        type: string
      chain_spec_version:
        required: false
        type: string
      genesis_hash:
        required: false
        type: string
      finalized_head:
        required: false
        type: string
concurrency:
  group: tuyufactory.client-ios.release
  cancel-in-progress: false
jobs:
  flow:
    name: 途遇厂家端 · Release · 分机 iOS
    runs-on: macos-15
    timeout-minutes: 120
    permissions:
      actions: write
      # 本主Job创建准确产品正式Release；写权限仅限当前仓。
      contents: write
    env:
      CI: true
      WRANGLER_SEND_METRICS: false
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: '1'
      CARGO_INCREMENTAL: '0'
      GH_TOKEN: "${{ github.token }}"
      TUYU_SOURCE_SHA: "${{ inputs.source_sha }}"
      TUYU_CI_RUN_ID: "${{ inputs.ci_run_id }}"
      TUYU_VERSION_TAG: "${{ inputs.version_tag }}"
      TUYU_SOFTWARE_VERSION: "${{ inputs.software_version }}"
      TUYU_SPEC_VERSION: "${{ inputs.spec_version }}"
      TUYU_CHAIN_SPEC_VERSION: "${{ inputs.chain_spec_version }}"
      TUYU_CHAIN_GENESIS_HASH: "${{ inputs.genesis_hash }}"
      TUYU_CHAIN_FINALIZED_HEAD: "${{ inputs.finalized_head }}"
      SOURCE_SHA: "${{ inputs.source_sha }}"
      CI_RUN_ID: "${{ inputs.ci_run_id }}"
      VERSION_TAG: "${{ inputs.version_tag }}"
      SOFTWARE_VERSION: "${{ inputs.software_version }}"
      SPEC_VERSION: "${{ inputs.spec_version }}"
      CHAIN_SPEC_VERSION: "${{ inputs.chain_spec_version }}"
      GENESIS_HASH: "${{ inputs.genesis_hash }}"
      FINALIZED_HEAD: "${{ inputs.finalized_head }}"
    steps:
    - shell: bash
      env:
        PIPELINE: "${{ inputs.pipeline }}"
        RUN_TITLE: "${{ inputs.run_title }}"
        SOURCE_SHA: "${{ inputs.source_sha }}"
        CI_RUN_ID: "${{ inputs.ci_run_id }}"
        VERSION_TAG: "${{ inputs.version_tag }}"
        SOFTWARE_VERSION: "${{ inputs.software_version }}"
        SPEC_VERSION: "${{ inputs.spec_version }}"
        CHAIN_SPEC_VERSION: "${{ inputs.chain_spec_version }}"
        GENESIS_HASH: "${{ inputs.genesis_hash }}"
        FINALIZED_HEAD: "${{ inputs.finalized_head }}"
      run: |-
        node --input-type=module <<'NODE'
        const e=process.env,allowed=new Set(["tuyufactory.client-ios.release"]);
        if(!allowed.has(e.PIPELINE||''))throw Error('产品流程身份无效');
        if(e.RUN_TITLE!=="途遇厂家端 · 分机 iOS · Release")throw Error('产品平台流程展示标题无效');
        if(!/^[0-9a-f]{40}$/.test(e.SOURCE_SHA||'')||!/^[1-9][0-9]*$/.test(e.CI_RUN_ID||'')||!e.VERSION_TAG)throw Error('Release来源输入无效');
        if(!e.SOFTWARE_VERSION||[e.SPEC_VERSION,e.CHAIN_SPEC_VERSION,e.GENESIS_HASH,e.FINALIZED_HEAD].some(Boolean))throw Error('软件Release输入无效');
        NODE
    - name: 检出准确产品源码
      uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      with:
        ref: "${{ inputs.source_sha }}"
        fetch-depth: 0
        persist-credentials: false
    - name: 登记本产品平台源码外资产目录
      shell: bash
      run: node "$GITHUB_WORKSPACE/scripts/client/release/ios/factory-client-ios/execute.mjs" workflow-step 10
    - name: 装载准确Rust
      uses: dtolnay/rust-toolchain@032958afbdc797a9164d3bc0b56325c1308924a5
      with:
        toolchain: 1.97.1
        targets: aarch64-apple-ios,aarch64-apple-ios-sim,aarch64-apple-darwin
    - name: 装载准确Java
      uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
      with:
        distribution: temurin
        java-version: 25.0.1+8
    - name: 装载Android SDK
      uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699
    - shell: bash
      run: node "$GITHUB_WORKSPACE/scripts/client/release/ios/factory-client-ios/execute.mjs" workflow-step 0
    - shell: bash
      run: node "$GITHUB_WORKSPACE/scripts/client/release/ios/factory-client-ios/execute.mjs" workflow-step 1
    - id: flutter_0
      shell: bash
      run: node "$GITHUB_WORKSPACE/scripts/client/release/ios/factory-client-ios/execute.mjs" workflow-step 2
    - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
      with:
        flutter-version: "${{ steps.flutter_0.outputs.version }}"
        cache: false
    - shell: bash
      run: node "$GITHUB_WORKSPACE/scripts/client/release/ios/factory-client-ios/execute.mjs" workflow-step 3
    - shell: bash
      run: node "$GITHUB_WORKSPACE/scripts/client/release/ios/factory-client-ios/execute.mjs" workflow-step 4
    - env:
        GH_TOKEN: "${{ github.token }}"
        SOURCE_SHA: "${{ inputs.source_sha }}"
        CI_RUN_ID: "${{ inputs.ci_run_id }}"
      shell: bash
      run: node "$GITHUB_WORKSPACE/scripts/client/release/ios/factory-client-ios/execute.mjs" workflow-step 5
    - shell: bash
      run: node "$GITHUB_WORKSPACE/scripts/client/release/ios/factory-client-ios/execute.mjs" workflow-step 6
    - env:
        IOS_KEY: "${{ secrets.IOS_KEY }}"
        IOS_PROVISIONING_PROFILE: "${{ secrets.APP_PROFILE }}"
      shell: bash
      run: node "$GITHUB_WORKSPACE/scripts/client/release/ios/factory-client-ios/execute.mjs" workflow-step 7
    - shell: bash
      run: node "$GITHUB_WORKSPACE/scripts/client/release/ios/factory-client-ios/execute.mjs" workflow-step 8
    - if: "${{ always() && env.TUYUFACTORY_WORK_ID != '' }}"
      env:
        TUYUFACTORY_CLEAN_RELEASE: "${{ job.status != 'success' && 'true' || 'false' }}"
      shell: bash
      run: node "$GITHUB_WORKSPACE/scripts/client/release/ios/factory-client-ios/execute.mjs" workflow-step 9
    - name: 清空本产品固定构建目录
      if: always()
      shell: bash
      run: node "$GITHUB_WORKSPACE/scripts/target.mjs" finish build
