---
name: tuyufactory.client-macos
run-name: "${{ github.workflow }} · ${{ github.run_number }}"
'on':
  workflow_dispatch: {}
concurrency:
  group: "${{ github.repository }}-client-macos"
  cancel-in-progress: false
  queue: max
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    outputs:
      version: "${{ steps.version.outputs.version }}"
      tag: "${{ steps.version.outputs.tag }}"
      source_sha: "${{ steps.version.outputs.source_sha }}"
      run_id: "${{ steps.version.outputs.run_id }}"
      run_attempt: "${{ steps.version.outputs.run_attempt }}"
      run_number: "${{ steps.version.outputs.run_number }}"
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      with:
        ref: "${{ github.sha }}"
        fetch-depth: 0
        persist-credentials: false
    - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
      with:
        node-version: 25.2.1
    - id: version
      env:
        GH_TOKEN: "${{ github.token }}"
      run: node .github/workflows/release-client-macos.mjs prepare
  flow:
    name: 途遇厂家端 · Release · 分机 macOS
    runs-on: xcode-27
    timeout-minutes: 120
    permissions:
      contents: read
      actions: read
    env:
      CI: 'true'
      WRANGLER_SEND_METRICS: false
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: '1'
      CARGO_INCREMENTAL: '0'
      GH_TOKEN: "${{ github.token }}"
      TUYU_SOURCE_SHA: "${{ github.sha }}"
      TUYU_VERSION_TAG: "${{ needs.prepare.outputs.tag }}"
      TUYU_SOFTWARE_VERSION: "${{ needs.prepare.outputs.version }}"
      SOURCE_SHA: "${{ github.sha }}"
      VERSION_TAG: "${{ needs.prepare.outputs.tag }}"
      SOFTWARE_VERSION: "${{ needs.prepare.outputs.version }}"
      RELEASE_VERSION: "${{ needs.prepare.outputs.version }}"
      RELEASE_TAG: "${{ needs.prepare.outputs.tag }}"
      PRODUCER_RUN_ID: "${{ github.run_id }}"
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      with:
        ref: "${{ github.sha }}"
        fetch-depth: 0
        persist-credentials: false
    - name: 登记本产品平台源码外资产目录
      shell: bash
      run: node "$GITHUB_WORKSPACE/.github/workflows/release-client-macos.mjs" step
        1
    - run: node .github/workflows/release-client-macos.mjs job
    - name: 装载准确Rust
      uses: dtolnay/rust-toolchain@032958afbdc797a9164d3bc0b56325c1308924a5
      with:
        toolchain: 1.97.1
        targets: aarch64-apple-darwin
    - name: 装载准确Java
      uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
      with:
        distribution: temurin
        java-version: 25.0.1+8
    - name: 装载Android SDK
      uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699
    - shell: bash
      run: node "$GITHUB_WORKSPACE/.github/workflows/release-client-macos.mjs" step
        2
    - shell: bash
      run: node "$GITHUB_WORKSPACE/.github/workflows/release-client-macos.mjs" step
        3
    - id: flutter_0
      shell: bash
      run: node "$GITHUB_WORKSPACE/.github/workflows/release-client-macos.mjs" step
        4
    - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
      with:
        flutter-version: "${{ steps.flutter_0.outputs.version }}"
        cache: false
    - shell: bash
      run: node "$GITHUB_WORKSPACE/.github/workflows/release-client-macos.mjs" step
        5
    - shell: bash
      run: node "$GITHUB_WORKSPACE/.github/workflows/release-client-macos.mjs" step
        6
    - env:
        GH_TOKEN: "${{ github.token }}"
        SOURCE_SHA: "${{ github.sha }}"
      shell: bash
      run: node "$GITHUB_WORKSPACE/.github/workflows/release-client-macos.mjs" step
        7
    - if: "${{ always() && env.TUYUFACTORY_WORK_ID != '' }}"
      env:
        TUYUFACTORY_CLEAN_RELEASE: "${{ job.status != 'success' && 'true' || 'false'
          }}"
      shell: bash
      run: node "$GITHUB_WORKSPACE/.github/workflows/release-client-macos.mjs" step
        8
    - id: complete
      name: 逐件收集完整正式产物
      run: node .github/workflows/release-client-macos.mjs collect-produced
    - name: 交付本次完整产物
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: release-output
        path: "${{ steps.complete.outputs.assets }}"
        if-no-files-found: error
        retention-days: 7
    needs:
    - prepare
  publish:
    needs:
    - prepare
    - flow
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      RELEASE_VERSION: "${{ needs.prepare.outputs.version }}"
      RELEASE_TAG: "${{ needs.prepare.outputs.tag }}"
      GH_TOKEN: "${{ github.token }}"
      CI: 'true'
      CARGO_INCREMENTAL: '0'
      PRODUCER_RUN_ID: "${{ github.run_id }}"
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      with:
        ref: "${{ github.sha }}"
        fetch-depth: 0
        persist-credentials: false
    - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
      with:
        node-version: 25.2.1
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: release-output
        path: "${{ runner.temp }}/release-output"
    - id: complete
      name: 正式Release上传并逐件回读
      run: node .github/workflows/release-client-macos.mjs publish "$RUNNER_TEMP/release-output"
  cleanup:
    if: "${{ always() }}"
    needs:
    - prepare
    - flow
    - publish
    runs-on: ubuntu-24.04
    permissions:
      actions: write
      contents: write
    env:
      GH_TOKEN: "${{ github.token }}"
      RELEASE_NEEDS: "${{ toJSON(needs) }}"
      RELEASE_TAG: "${{ needs.prepare.outputs.tag }}"
      PRODUCER_RUN_ID: "${{ github.run_id }}"
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      with:
        ref: "${{ github.sha }}"
        fetch-depth: 0
        persist-credentials: false
    - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
      with:
        node-version: 25.2.1
    - name: 按全部前置结果清理本目标同类历史
      run: node .github/workflows/release-client-macos.mjs finish
